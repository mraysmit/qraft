# Qraft Server 5-Node Cluster for Advanced Testing
# This configuration sets up a 5-node Raft cluster for testing more complex scenarios

services:
  server1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server1
    hostname: server1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8081:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/server1.json:/etc/qraft/server.json:ro
      - server1-data:/app/data
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  server2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server2
    hostname: server2
    command: ["server", "--config", "/etc/qraft/server.json"]
