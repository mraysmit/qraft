      start_period: 30s
    restart: unless-stopped

  server5:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server5
    hostname: server5
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8085:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/server5.json:/etc/qraft/server.json:ro
