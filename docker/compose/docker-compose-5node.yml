# Qraft Controller 5-Node Cluster for Advanced Testing
# This configuration sets up a 5-node Raft cluster for testing more complex scenarios

services:
  controller1:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller1
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8081:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/controller1.json:/etc/qraft/server.json:ro
      - controller1-data:/app/data
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  controller2:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller2
    hostname: controller2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8082:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/controller2.json:/etc/qraft/server.json:ro
      - controller2-data:/app/data
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  controller3:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller3
    hostname: controller3
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8083:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/controller3.json:/etc/qraft/server.json:ro
      - controller3-data:/app/data
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  controller4:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller4
    hostname: controller4
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8084:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/controller4.json:/etc/qraft/server.json:ro
      - controller4-data:/app/data
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  controller5:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller5
    hostname: controller5
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8085:8080"
    networks:
      - raft-cluster-5
    volumes:
      - ../config/five-node/controller5.json:/etc/qraft/server.json:ro
      - controller5-data:/app/data
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  raft-cluster-5:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  controller1-data:
    driver: local
  controller2-data:
    driver: local
  controller3-data:
    driver: local
  controller4-data:
    driver: local
  controller5-data:
    driver: local
