      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  raft-cluster-5:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  server1-data:
    driver: local
  server2-data:
    driver: local
  server3-data:
    driver: local
  server4-data:
    driver: local
  server5-data:
    driver: local
