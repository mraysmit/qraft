# Qraft Server-First Architecture
# Each server is a self-contained node with embedded HTTP API
# This provides natural scaling and fault tolerance
#
# The executable runtime JAR must be built on the host before Compose runs:
#   mvn package -DskipTests

services:
  # Server Node 1
  server1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server1
    hostname: server1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8081:8080"  # HTTP API
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.11
    volumes:
      - ../config/three-node/server1.json:/etc/qraft/server.json:ro
      - server1-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-server1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Server Node 2
  server2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server2
    hostname: server2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8082:8080"  # HTTP API
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.12
    volumes:
      - ../config/three-node/server2.json:/etc/qraft/server.json:ro
      - server2-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-server2"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - server1

  # Server Node 3
  server3:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server3
    hostname: server3
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8083:8080"  # HTTP API
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.13
    volumes:
      - ../config/three-node/server3.json:/etc/qraft/server.json:ro
      - server3-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-server3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - server1
      - server2

  # Load Balancer for High Availability
  nginx:
    image: nginx:alpine
    container_name: qraft-loadbalancer
    ports:
      - "8080:80"  # Main API endpoint
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.10
    depends_on:
      - server1
      - server2
      - server3
    labels:
      - "logging=promtail"
      - "service=qraft-loadbalancer"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  qraft-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  server1-data:
    driver: local
  server2-data:
    driver: local
  server3-data:
    driver: local
