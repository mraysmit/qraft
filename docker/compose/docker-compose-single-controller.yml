networks:
  qraft-dev:
    driver: bridge

services:
  controller:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller-dev
    environment:
      - QRAFT_MODE=server
      - QRAFT_NODE_ID=controller-dev
      - QRAFT_RAFT_HOST=0.0.0.0
      - QRAFT_RAFT_PORT=9080
      - QRAFT_HTTP_PORT=8080
      - QRAFT_CLUSTER_NODES=controller-dev=controller:9080
      - QRAFT_RAFT_ELECTION_TIMEOUT_MS=3000
      - QRAFT_RAFT_HEARTBEAT_INTERVAL_MS=500
      - JAVA_OPTS=-Xmx512m -Xms256m
    ports:
      - "8080:8080"
    networks:
      - qraft-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
