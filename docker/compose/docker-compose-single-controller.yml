networks:
  qraft-dev:
    driver: bridge

services:
  controller:
    command: ["server", "--config", "/etc/qraft/server.json"]
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller-dev
    volumes:
      - ../config/single/server.json:/etc/qraft/server.json:ro
    ports:
      - "8080:8080"
    networks:
      - qraft-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
