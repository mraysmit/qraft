# Qraft Multi-Node Cluster Configuration
# 3-node server cluster for testing distributed scenarios

services:
  server1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server1
    hostname: server1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8081:8080"
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.11
    volumes:
      - ../config/three-node/server1.json:/etc/qraft/server.json:ro
      - server1-data:/app/data
      - ../../logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  server2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server2
    hostname: server2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8082:8080"
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.12
    volumes:
      - ../config/three-node/server2.json:/etc/qraft/server.json:ro
      - server2-data:/app/data
      - ../../logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - server1

  server3:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server3
    hostname: server3
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8083:8080"
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.13
    volumes:
      - ../config/three-node/server3.json:/etc/qraft/server.json:ro
      - server3-data:/app/data
      - ../../logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - server1
      - server2

networks:
  qraft-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  server1-data:
    driver: local
  server2-data:
    driver: local
  server3-data:
    driver: local
