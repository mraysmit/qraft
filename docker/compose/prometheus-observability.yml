# Prometheus Configuration for Qraft Observability Stack
# Scrapes metrics from OTel Collector and directly from Qraft services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'qraft-local'
    environment: 'test'

# Remote write receiver for OTel Collector
# Enabled via --web.enable-remote-write-receiver flag

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OTel Collector internal metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'

  # Tempo internal metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'

  # Loki internal metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Qraft Server - Single node (standalone mode on port 9464)
  - job_name: 'qraft-server-standalone'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9464']
        labels:
          service: 'qraft-server'
          deployment: 'standalone'
          node: 'standalone'

  # Qraft Server - 3-node local cluster
  - job_name: 'qraft-server-cluster'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9471']
        labels:
          service: 'qraft-server'
          deployment: 'cluster'
          node: 'node-1'
      - targets: ['host.docker.internal:9472']
        labels:
          service: 'qraft-server'
          deployment: 'cluster'
          node: 'node-2'
      - targets: ['host.docker.internal:9473']
        labels:
          service: 'qraft-server'
          deployment: 'cluster'
          node: 'node-3'

  # Qraft Client (when running on Docker host)
  - job_name: 'qraft-client-host'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9465']
        labels:
          service: 'qraft-client'
          deployment: 'host'

  # Qraft Server cluster (server-first architecture in Docker)
  # These use the HTTP API metrics endpoint on port 8080
  - job_name: 'qraft-servers-compose'
    scrape_interval: 5s
    static_configs:
      - targets: ['server1:8080']
        labels:
          service: 'qraft-server'
          deployment: 'compose-cluster'
          node: 'server1'
      - targets: ['server2:8080']
        labels:
          service: 'qraft-server'
          deployment: 'compose-cluster'
          node: 'server2'
      - targets: ['server3:8080']
        labels:
          service: 'qraft-server'
          deployment: 'compose-cluster'
          node: 'server3'

  # Qraft Server cluster (when running in Docker)
  - job_name: 'qraft-server-docker'
    scrape_interval: 10s
    dns_sd_configs:
      - names:
          - 'server'
        type: 'A'
        port: 9464
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: []
        target_label: service
        replacement: 'qraft-server'
      - source_labels: []
        target_label: deployment
        replacement: 'docker'
