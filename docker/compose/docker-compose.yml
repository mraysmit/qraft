# Qraft Controller Cluster for Testing
# This configuration sets up a 5-node Raft cluster for integration testing

name: qraft

services:
  controller1:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller1
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8081:8080"
    networks:
      raft-cluster:
        ipv4_address: 172.20.0.10
    volumes:
      - ../config/five-node/controller1.json:/etc/qraft/server.json:ro
      - controller1-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  controller2:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller2
    hostname: controller2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8082:8080"
    networks:
      raft-cluster:
        ipv4_address: 172.20.0.11
    volumes:
      - ../config/five-node/controller2.json:/etc/qraft/server.json:ro
      - controller2-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - controller1

  controller3:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller3
    hostname: controller3
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8083:8080"
    networks:
      raft-cluster:
        ipv4_address: 172.20.0.12
    volumes:
      - ../config/five-node/controller3.json:/etc/qraft/server.json:ro
      - controller3-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - controller1
      - controller2

  controller4:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller4
    hostname: controller4
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8084:8080"
    networks:
      raft-cluster:
        ipv4_address: 172.20.0.13
    volumes:
      - ../config/five-node/controller4.json:/etc/qraft/server.json:ro
      - controller4-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - controller1
      - controller2
      - controller3

  controller5:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller5
    hostname: controller5
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8085:8080"
    networks:
      raft-cluster:
        ipv4_address: 172.20.0.14
    volumes:
      - ../config/five-node/controller5.json:/etc/qraft/server.json:ro
      - controller5-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - controller1
      - controller2
      - controller3
      - controller4

networks:
  # Primary cluster network for normal operations
  raft-cluster:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: raft-cluster-br
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500

  # Secondary network for partition testing
  raft-partition-a:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    driver_opts:
      com.docker.network.bridge.name: raft-partition-a-br
      com.docker.network.bridge.enable_icc: "true"

  # Third network for complex partition scenarios
  raft-partition-b:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
    driver_opts:
      com.docker.network.bridge.name: raft-partition-b-br
      com.docker.network.bridge.enable_icc: "true"

volumes:
  controller1-data:
    driver: local
  controller2-data:
    driver: local
  controller3-data:
    driver: local
  controller4-data:
    driver: local
  controller5-data:
    driver: local
