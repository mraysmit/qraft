# Advanced Network Testing Configuration for Qraft Server Cluster
# This configuration supports dynamic network partitioning and realistic network conditions

services:
  server1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: qraft-server1
    hostname: server1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "${PUBLISHED_PORT:-8081}:8080"
    networks:
      - raft-cluster
    volumes:
      - ../config/five-node/server1.json:/etc/qraft/server.json:ro
      - server1-data:/app/data
    cap_add:
      - NET_ADMIN  # Required for network manipulation (tc, iptables)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  server2:
