  # Network monitoring and testing tools
  network-monitor:
    image: nicolaka/netshoot:latest
    container_name: qraft-network-monitor
    hostname: network-monitor
    networks:
      - raft-cluster
      - raft-partition-a
      - raft-partition-b
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    profiles:
      - monitoring

networks:
  # Primary cluster network
  raft-cluster:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: raft-cluster-br
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500
  
  # Partition network A (for split-brain testing)
  raft-partition-a:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: raft-partition-a-br
      com.docker.network.bridge.enable_icc: "true"
  
  # Partition network B (for complex partition scenarios)
  raft-partition-b:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: raft-partition-b-br
      com.docker.network.bridge.enable_icc: "true"

volumes:
  server1-data:
    driver: local
  server2-data:
    driver: local
  server3-data:
    driver: local
  server4-data:
    driver: local
  server5-data:
    driver: local
