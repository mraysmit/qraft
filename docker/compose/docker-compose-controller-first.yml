# Qraft Controller-First Architecture
# Each controller is a self-contained node with embedded HTTP API
# This provides natural scaling and fault tolerance
#
# The executable runtime JAR must be built on the host before Compose runs:
#   mvn package -pl qraft-runtime -am -DskipTests

services:
  # Controller Node 1
  controller1:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller1
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8081:8080"  # HTTP API
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.11
    volumes:
      - ../config/three-node/controller1.json:/etc/qraft/server.json:ro
      - controller1-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Controller Node 2
  controller2:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller2
    hostname: controller2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8082:8080"  # HTTP API
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.12
    volumes:
      - ../config/three-node/controller2.json:/etc/qraft/server.json:ro
      - controller2-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller2"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - controller1

  # Controller Node 3
  controller3:
    build:
      context: ../..
      dockerfile: qraft-runtime/Dockerfile
    container_name: qraft-controller3
    hostname: controller3
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8083:8080"  # HTTP API
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.13
    volumes:
      - ../config/three-node/controller3.json:/etc/qraft/server.json:ro
      - controller3-data:/app/data
      - ../../logs:/app/logs
    labels:
      - "logging=promtail"
      - "service=qraft-controller3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - controller1
      - controller2

  # Load Balancer for High Availability
  nginx:
    image: nginx:alpine
    container_name: qraft-loadbalancer
    ports:
      - "8080:80"  # Main API endpoint
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      qraft-cluster:
        ipv4_address: 172.20.0.10
    depends_on:
      - controller1
      - controller2
      - controller3
    labels:
      - "logging=promtail"
      - "service=qraft-loadbalancer"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  qraft-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  controller1-data:
    driver: local
  controller2-data:
    driver: local
  controller3-data:
    driver: local
