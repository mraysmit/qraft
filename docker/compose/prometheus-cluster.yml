# Prometheus Configuration for 3-Node Cluster

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: 'qraft-cluster'
    environment: 'docker'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'qraft-server1'
    static_configs:
      - targets: ['server1:9464']
        labels:
          node: 'server1'
          service: 'qraft-server'

  - job_name: 'qraft-server2'
    static_configs:
      - targets: ['server2:9464']
        labels:
          node: 'server2'
          service: 'qraft-server'

  - job_name: 'qraft-server3'
    static_configs:
      - targets: ['server3:9464']
        labels:
          node: 'server3'
          service: 'qraft-server'
