<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Qraft administrative interface prototype">
  <title>Qraft Console — Interactive Admin Prototype</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233152c8'/%3E%3Cpath d='M9 10h10a6 6 0 1 1 0 12h-4' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M15 18l-4 4 4 4' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --nav-width:272px; --bg:#f3f5f8; --surface:#fff; --surface-2:#f8fafc;
      --surface-3:#eef2f6; --text:#172033; --muted:#657087; --line:#cbd4e0;
      --line-strong:#aeb9c9; --brand:#3152c8; --brand-dark:#233f9f;
      --brand-soft:#e8edff; --accent:#07a58a; --warning:#c87917;
      --danger:#c23b4a; --success:#16835c; --info:#2b63b6; --focus:#2b63f1;
      --shadow:0 10px 30px rgba(28,39,64,.09); --shadow-soft:0 2px 10px rgba(28,39,64,.07);
      --radius:12px; --radius-sm:8px; --header-h:64px; --tabs-h:43px;
      --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    html[data-theme="dark"] {
      --bg:#10141d; --surface:#171d28; --surface-2:#1d2532; --surface-3:#273141;
      --text:#ecf1f8; --muted:#a4afc2; --line:#3a465a; --line-strong:#58667d;
      --brand:#7f9cff; --brand-dark:#a9bcff; --brand-soft:#29365d;
      --accent:#49d5b7; --warning:#f0ad4e; --danger:#ff7b8a;
      --success:#55d59f; --info:#75abf2; --focus:#9ab0ff;
      --shadow:0 12px 34px rgba(0,0,0,.26); --shadow-soft:0 2px 12px rgba(0,0,0,.22);
    }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body { background:var(--bg); color:var(--text); font:14px/1.45 var(--font); overflow:hidden; }
    button,input,select,textarea { color:inherit; font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible { outline:3px solid color-mix(in srgb,var(--focus) 34%,transparent); outline-offset:1px; }
    .hidden { display:none!important; }
    #app { height:100%; display:grid; grid-template-rows:var(--header-h) 1fr 30px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line); z-index:40; }
    .brand { display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:5px; min-width:180px; text-align:left; }
    .brand-mark { width:35px; height:35px; border-radius:10px; background:linear-gradient(145deg,var(--brand),var(--brand-dark)); color:#fff; display:grid; place-items:center; font-weight:800; box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 28%,transparent); }
    .brand strong,.brand span { display:block; }
    .brand strong { font-size:15px; letter-spacing:.01em; }
    .brand span { color:var(--muted); font-size:11px; }
    .context { display:flex; align-items:center; gap:7px; }
    .context label { color:var(--muted); font-size:11px; font-weight:650; }
    .context select,.quick-search input { min-height:35px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); padding:6px 30px 6px 9px; }
    .quick-search { position:relative; width:min(320px,26vw); margin-left:auto; }
    .quick-search input { width:100%; padding-left:31px; }
    .quick-search:before { content:'⌕'; position:absolute; left:10px; top:7px; color:var(--muted); }
    .icon-button,.user-button { min-width:35px; min-height:35px; border:1px solid transparent; border-radius:8px; background:transparent; }
    .icon-button:hover,.user-button:hover { background:var(--surface-3); border-color:var(--line); }
    .user-button { background:var(--brand-soft); color:var(--brand); font-weight:750; padding:0 10px; }
    .body-grid { min-height:0; display:grid; grid-template-columns:var(--nav-width) 6px minmax(0,1fr); }
    .sidebar { min-width:0; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
    .sidebar-head { padding:16px 15px 10px; display:flex; align-items:center; justify-content:space-between; }
    .sidebar-head h2 { margin:0; color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; }
    .nav-scroll { overflow:auto; padding:0 8px 16px; }
    .nav-group { margin:4px 0 13px; }
    .nav-group-title { width:100%; display:flex; justify-content:space-between; border:0; background:transparent; color:var(--muted); padding:8px 9px 5px; font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.06em; }
    .nav-group.collapsed .nav-items { display:none; }
    .nav-item { width:100%; min-height:38px; display:flex; align-items:center; gap:10px; border:0; border-radius:8px; background:transparent; padding:7px 10px; text-align:left; margin:1px 0; }
    .nav-item:hover { background:var(--surface-2); }
    .nav-item.active { background:var(--brand-soft); color:var(--brand); font-weight:700; }
    .nav-icon { width:25px; height:25px; display:grid; place-items:center; border-radius:7px; background:var(--surface-3); color:var(--muted); flex:0 0 auto; }
    .nav-item.active .nav-icon { color:#fff; background:var(--brand); }
    .nav-badge { margin-left:auto; min-width:19px; padding:1px 6px; border-radius:10px; background:var(--surface-3); color:var(--muted); font-size:10px; text-align:center; }
    .sidebar-footer { margin-top:auto; border-top:1px solid var(--line); padding:12px 14px; color:var(--muted); font-size:11px; }
    .sidebar-footer strong { color:var(--text); }
    .sidebar.collapsed .nav-item>span:not(.nav-icon),.sidebar.collapsed .nav-group-title span:first-child,.sidebar.collapsed .sidebar-footer,.sidebar.collapsed .sidebar-head h2 { display:none; }
    .sidebar.collapsed .nav-item { justify-content:center; padding-inline:5px; }
    .sidebar.collapsed .nav-group-title { justify-content:center; }
    .splitter { cursor:col-resize; background:var(--bg); border-right:1px solid var(--line); }
    .splitter:hover,.splitter.dragging { background:var(--brand-soft); }
    .workspace { min-width:0; min-height:0; display:grid; grid-template-rows:var(--tabs-h) minmax(0,1fr); }
    .tabs { display:flex; align-items:end; gap:2px; padding:0 10px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--line); }
    .tab { display:flex; align-items:center; gap:9px; max-width:230px; height:36px; border:1px solid transparent; border-bottom:0; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); padding:0 11px; white-space:nowrap; }
    .tab.active { background:var(--bg); color:var(--text); border-color:var(--line); font-weight:700; }
    .tab-close { color:var(--muted); font-size:17px; }
    .screen-host { min-height:0; overflow:auto; padding:18px; }
    .screen { max-width:1600px; margin:0 auto; }
    .screen-heading { display:flex; align-items:flex-start; gap:16px; margin-bottom:15px; }
    .screen-heading h1 { margin:0; font-size:25px; line-height:1.2; }
    .screen-heading p { margin:5px 0 0; color:var(--muted); }
    .heading-actions { margin-left:auto; display:flex; gap:7px; }
    .cluster-strip { display:flex; align-items:center; gap:17px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 13px; margin-bottom:14px; box-shadow:var(--shadow-soft); }
    .cluster-strip strong { font-size:12px; }
    .cluster-strip span { color:var(--muted); font-size:12px; }
    .cluster-strip .state { color:var(--success); }
    .cluster-strip .attention { color:var(--danger); }
    .cluster-strip .right { margin-left:auto; }
    .toolbar { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:7px; box-shadow:var(--shadow-soft); display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
    .tool-button,.button { min-height:35px; border:1px solid transparent; border-radius:8px; background:transparent; padding:6px 10px; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
    .tool-button:hover,.button:hover { background:var(--surface-3); }
    .button { border-color:var(--line-strong); background:var(--surface); }
    .button.primary { border-color:var(--brand); background:var(--brand); color:#fff; }
    .button.danger { color:var(--danger); }
    .toolbar-spacer,.right { margin-left:auto; }
    .toolbar input,.toolbar select { min-height:34px; border:1px solid var(--line); background:var(--surface-2); border-radius:7px; padding:6px 9px; }
    .toolbar input { min-width:min(330px,40vw); }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
    .stat,.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-soft); }
    .stat { padding:14px; }
    .stat span { display:block; color:var(--muted); font-size:12px; }
    .stat strong { display:block; margin-top:2px; font-size:25px; }
    .stat em { display:block; color:var(--muted); font-size:11px; font-style:normal; margin-top:2px; }
    .panel { overflow:hidden; }
    .panel-head { min-height:48px; display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:15px; }
    .panel-head p { margin:0; color:var(--muted); font-size:12px; }
    .panel-body { padding:14px; }
    .grid-two { display:grid; grid-template-columns:1.2fr .8fr; gap:14px; }
    .grid-equal { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { background:var(--surface-2); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
    tbody tr:hover td { background:var(--surface-2); }
    tbody tr.selected td { background:var(--brand-soft); }
    td strong { font-size:13px; }
    td small { display:block; color:var(--muted); margin-top:2px; }
    .number { text-align:right; font-variant-numeric:tabular-nums; }
    .status { display:inline-flex; align-items:center; gap:6px; border-radius:20px; background:var(--surface-3); padding:4px 8px; font-size:11px; font-weight:700; }
    .status:before { content:''; width:7px; height:7px; border-radius:50%; background:var(--muted); }
    .status.good:before { background:var(--success); } .status.warn:before { background:var(--warning); }
    .status.bad:before { background:var(--danger); } .status.info:before { background:var(--info); }
    .detail-tabs { display:flex; gap:3px; border-bottom:1px solid var(--line); margin-bottom:14px; }
    .detail-tab { border:0; border-bottom:3px solid transparent; background:transparent; color:var(--muted); padding:10px 12px; }
    .detail-tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:700; }
    .detail-kv { display:grid; grid-template-columns:170px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
    .detail-kv dt { color:var(--muted); } .detail-kv dd { margin:0; }
    .event { display:grid; grid-template-columns:9px 105px 1fr auto; align-items:start; gap:10px; padding:11px 13px; border-bottom:1px solid var(--line); }
    .event-dot { width:9px; height:9px; border-radius:50%; margin-top:5px; background:var(--info); }
    .event-dot.warn { background:var(--warning); } .event-dot.bad { background:var(--danger); } .event-dot.good { background:var(--success); }
    .event time,.event small { color:var(--muted); font-size:11px; }
    .event p { margin:2px 0 0; color:var(--muted); }
    .raft-map { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:18px; }
    .raft-node { border:1px solid var(--line); border-radius:10px; padding:13px; background:var(--surface-2); position:relative; }
    .raft-node.leader { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
    .raft-node h3 { margin:0 0 7px; font-size:14px; }
    .lag-bar { height:7px; background:var(--surface-3); border-radius:5px; overflow:hidden; margin-top:9px; }
    .lag-bar span { display:block; height:100%; background:var(--success); }
    .topology { position:relative; min-height:430px; overflow:hidden; background:radial-gradient(circle at 50% 40%,var(--brand-soft),transparent 45%),var(--surface-2); }
    .topo-node { position:absolute; transform:translate(-50%,-50%); min-width:145px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); padding:11px; text-align:center; box-shadow:var(--shadow-soft); }
    .topo-node.core { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
    .topo-node.gateway { border-color:var(--accent); }
    .topo-node strong,.topo-node small { display:block; }
    .topo-node small { color:var(--muted); margin-top:3px; }
    .edge { position:absolute; height:2px; transform-origin:left center; background:var(--line-strong); }
    .edge.allow { background:var(--success); } .edge.deny { background:var(--danger); border-top:1px dashed var(--surface); }
    .tree-detail { display:grid; grid-template-columns:minmax(250px,.65fr) minmax(0,1.35fr); gap:14px; }
    .tree-list button { display:block; width:100%; border:0; background:transparent; padding:9px; text-align:left; border-radius:7px; }
    .tree-list button.active { background:var(--brand-soft); color:var(--brand); font-weight:700; }
    .kv-value { min-height:220px; width:100%; resize:vertical; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); padding:12px; font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .empty { padding:55px 20px; text-align:center; color:var(--muted); }
    .empty strong { display:block; color:var(--text); font-size:18px; margin-bottom:5px; }
    .statusbar { display:flex; align-items:center; gap:14px; padding:0 12px; background:var(--surface); border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    .statusbar .connection { color:var(--success); }
    .drawer { position:fixed; z-index:100; right:0; top:var(--header-h); bottom:30px; width:min(430px,92vw); background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow); transform:translateX(102%); transition:transform .18s ease; }
    .drawer.open { transform:none; }
    .drawer-head { display:flex; align-items:center; padding:13px; border-bottom:1px solid var(--line); }
    .drawer-head h2 { margin:0; font-size:17px; }
    .modal-backdrop { position:fixed; z-index:120; inset:0; display:none; place-items:center; padding:20px; background:rgba(9,13,22,.55); }
    .modal-backdrop.open { display:grid; }
    .modal { width:min(620px,96vw); max-height:88vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    .modal-head,.modal-foot { display:flex; align-items:center; gap:8px; padding:13px 15px; border-bottom:1px solid var(--line); }
    .modal-head h2 { margin:0; font-size:18px; } .modal-foot { border-top:1px solid var(--line); border-bottom:0; justify-content:flex-end; }
    .modal-body { padding:16px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .field label { display:block; color:var(--muted); font-size:12px; font-weight:650; margin-bottom:5px; }
    .field input,.field select,.field textarea { width:100%; border:1px solid var(--line-strong); border-radius:7px; background:var(--surface); padding:8px 9px; }
    .field.wide { grid-column:1/-1; }
    .toast-region { position:fixed; z-index:160; right:18px; bottom:44px; display:grid; gap:8px; }
    .toast { min-width:270px; padding:11px 13px; border-radius:9px; background:var(--text); color:var(--surface); box-shadow:var(--shadow); }
    @media(max-width:1050px) { :root{--nav-width:230px}.stats{grid-template-columns:repeat(2,1fr)}.grid-two{grid-template-columns:1fr}.context.region{display:none}.quick-search{width:220px}.raft-map{grid-template-columns:1fr}.topology{min-height:520px} }
    @media(max-width:760px) {
      body{overflow:auto} #app{min-height:100vh;height:auto;grid-template-rows:auto 1fr 30px}.topbar{min-height:64px;flex-wrap:wrap;padding:9px}.brand{min-width:auto}.brand span,.context label,.quick-search{display:none}.context{flex:1}.context select{width:100%}
      .body-grid{display:block}.splitter{display:none}.sidebar{position:fixed;z-index:80;inset:64px auto 30px 0;width:min(310px,88vw);transform:translateX(-102%);transition:transform .18s;box-shadow:var(--shadow)}.sidebar.mobile-open{transform:none}.workspace{width:100%;min-height:calc(100vh - 94px)}.screen-host{width:100%;padding:11px;overflow-x:hidden}.screen{width:100%;min-width:0}.screen-heading p{overflow-wrap:anywhere}.stats,.grid-equal,.form-grid,.tree-detail{grid-template-columns:1fr}.toolbar input{min-width:160px;max-width:100%}.screen-heading{display:block}.heading-actions{margin:10px 0 0}.cluster-strip .right{margin-left:0}.topology{min-height:620px}.detail-tabs{overflow:auto}.event{grid-template-columns:9px 75px 1fr}.event>small:last-child{display:none}
    }
    @media print { .topbar,.sidebar,.splitter,.tabs,.statusbar,.toolbar,.cluster-strip,.toast-region{display:none!important}body,#app,.body-grid,.workspace,.screen-host{display:block;height:auto;overflow:visible;background:#fff;color:#000}.panel{box-shadow:none} }
  </style>
</head>

<aside class="drawer" id="messageDrawer" aria-hidden="true">

</aside>
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle">Dialog</h2><button class="icon-button right" data-close-modal aria-label="Close dialog">×</button></div>
    <div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div>

</div>

<script>
(() => {
  'use strict';
  const data=JSON.parse(document.getElementById('qraft-data').textContent);

  const nav=document.getElementById('nav'),tabs=document.getElementById('tabs'),host=document.getElementById('screenHost');

  function clusterStrip(){return `<div class="cluster-strip"><strong class="state">● Healthy cluster</strong><span>Leader <strong>server-2</strong></span><span>Quorum <strong>3 / 3</strong></span><span class="attention">2 services require attention</span><span class="right">Term 48 · Applied 12,842</span></div>`}

  function status(value){return `<span class="status ${healthClass(value)}">${esc(value)}</span>`}

  function renderTabs(){tabs.innerHTML=state.tabs.map(id=>`<button class="tab ${state.active===id?'active':''}" role="tab" aria-selected="${state.active===id}" data-tab="${id}"><span>${esc(title(id))}</span><span class="tab-close" data-close="${id}" aria-label="Close ${esc(title(id))}">×</span></button>`).join('')}

/dd></div><div class="detail-kv"><dt>Failure</dt><dd>HTTP 503 after 3,004 ms</dd></div><div class="detail-kv"><dt>Authoritative since</dt><dd>Index 12,842</dd></div></dl></div></section>`,topology:`<div class="panel">${topologyMarkup()}</div>`,events:eventPanel(data.events.filter(e=>e.title.includes('payment-api')||e.title.includes('Intention'))) }[state.detailTab];host.innerHTML=`<section class="screen">${clusterStrip()}${heading(s.name,'Service details and operational history.','<button class="button" data-service-action="edit">Edit</button><button class="button danger" data-service-action="deregister">Deregister</button>')}<div class="detail-tabs">${[['overview','Overview'],['instances','Instances'],['checks','Health checks'],['topology','Topology'],['events','Events']].map(x=>`<button class="detail-tab ${state.detailTab===x[0]?'active':''}" data-detail-tab="${x[0]}">${x[1]}</button>`).join('')}</div>${content}</section>`}
  function renderNodes(){host.innerHTML=`<section class="screen">${clusterStrip()}${heading('Nodes & agents','Inspect Raft members, client agents, readiness and reconciliation.')}<div class="toolbar"><input placeholder="Search nodes, addresses or services"><select><option>All types</option><option>Servers</option><option>Agents</option></select><select><option>All health</option><option>Passing</option><option>Critical</option></select><span class="toolbar-spacer"></span><button class="tool-button">↻ Refresh</button></div><div class="panel"><table><thead><tr><th>Node</th><th>Kind</th><th>State</th><th>Role</th><th>Address</th><th class="number">Services</th><th class="number">Applied index</th><th>Last contact</th></tr></thead><tbody>${data.nodes.map(n=>`<tr><td><strong>${n.id}</strong><small>london-1</small></td><td>${n.kind}</td><td>${status(n.health)}</td><td>${n.role==='Leader'?'<span class="status info">Leader</span>':n.role}</td><td>${n.address}</td><td class="number">${n.services}</td><td class="number">${n.applied??'—'}</td><td>${n.last}</td></tr>`).join('')}</tbody></table></div></section>`}

  function renderConfiguration(){host.innerHTML=`<section class="screen">${clusterStrip()}${heading('Configuration','Inspect redacted effective configuration and its source.')}<div class="panel"><table><thead><tr><th>Setting</th><th>Effective value</th><th>Source</th><th>Change model</th></tr></thead><tbody><tr><td><strong>qraft.mode</strong></td><td>server</td><td>QRAFT_MODE</td><td>Static · restart required</td></tr><tr><td><strong>qraft.datacenter</strong></td><td>london-1</td><td>qraft.properties</td><td>Static · restart required</td></tr><tr><td><strong>qraft.snapshot.threshold</strong></td><td>10,000</td><td>replicated configuration</td><td>Dynamic</td></tr><tr><td><strong>qraft.auth.token</strong></td><td>••••••••</td><td>secret reference</td><td>Protected</td></tr></tbody></table></div></section>`}
  function renderTenancy(){genericTable('Tenants & namespaces','Administer isolation, policy assignments and quotas.',['Tenant','Namespace','State','Services','KV keys','Policies'],[['production','payments','Enabled','5','42','payments-operator'],['production','identity','Enabled','3','18','identity-operator'],['platform','default','Enabled','7','31','platform-admin']],'namespace')}
  function renderAccess(){genericTable('Access control','Manage tokens, policies, roles and authentication methods.',['Resource','Type','Scope','Assignments','Updated'],[['payments-operator','Policy','production / payments','2 roles','2 days ago'],['platform-admin','Role','platform / *','6 users','4 days ago'],['kubernetes','Auth method','production','3 bindings','8 days ago']],'access')}
  function renderAudit(){host.innerHTML=`<section class="screen">${clusterStrip()}${heading('Audit','Trace administrative activity and authorization decisions.')}<div class="toolbar"><input placeholder="Search principal, operation, target or request ID"><select><option>All results</option><option>Committed</option><option>Rejected</option><option>Unauthorized</option></select><span class="toolbar-spacer"></span><button class="tool-button">⇩ Export</button></div>${eventPanel(data.events.filter(e=>e.category==='Audit'))}<div class="panel" style="margin-top:14px"><div class="empty"><strong>Bounded local history</strong>Durable audit retention is not configured for this prototype.</div></div></section>`}
  function genericTable(name,description,headers,rows,createKind){const visible=[...(state.created[createKind]||[]),...rows];const action=createKind?`<button class="button primary" data-create="${createKind}">＋ Create</button>`:'';host.innerHTML=`<section class="screen">${clusterStrip()}${heading(name,description,action)}<div class="toolbar"><input placeholder="Search current view"><span class="toolbar-spacer"></span><button class="tool-button" data-refresh>↻ Refresh</button></div><div class="panel"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${visible.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<strong>${esc(c)}</strong>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
  function showModal(name,body,buttons=[]){document.getElementById('modalTitle').textContent=name;document.getElementById('modalBody').innerHTML=body;const foot=document.getElementById('modalFoot');foot.innerHTML='';buttons.forEach(b=>{const x=document.createElement('button');x.className=`button ${b.primary?'primary':''} ${b.danger?'danger':''}`;x.textContent=b.label;x.onclick=b.action;foot.append(x)});document.getElementById('modalBackdrop').classList.add('open');document.getElementById('modalBackdrop').setAttribute('aria-hidden','false')}
  function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modalBackdrop').setAttribute('aria-hidden','true')}
  function registerService(){showModal('Register service',`<form class="form-grid" id="serviceForm"><div class="field"><label>Service name</label><input name="name" value="refund-api" required></div><div class="field"><label>Service ID</label><input name="id" value="refund-api-01" required></div><div class="field"><label>Node</label><select name="node"><option>app-node-22</option></select></div><div class="field"><label>Port</label><input name="port" type="number" value="8080" required></div><div class="field wide"><label>Address</label><input name="address" value="10.24.8.22" required></div></form><p>This mutation will be replicated through Raft in production / payments.</p>`,[{label:'Cancel',action:closeModal},{label:'Register',primary:true,action:()=>{const form=document.getElementById('serviceForm');if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));if(!data.services.some(s=>s.name===values.name))data.services.unshift({name:values.name,type:'Service',health:'Passing',instances:1,passing:1,warning:0,critical:0,tags:['new'],mesh:'Enabled',updated:'just now'});closeModal();renderServices();toast(`${values.name} registered at index 12,843`)}}])}
  function newIntention(){showModal('Create intention',`<form class="form-grid" id="intentionForm"><div class="field"><label>Source</label><select name="source"><option>web-frontend</option><option>reporting-job</option></select></div><div class="field"><label>Destination</label><select name="destination"><option>payment-api</option><option>identity-api</option></select></div><div class="field"><label>Decision</label><select name="decision"><option>Allow</option><option>Deny</option></select></div><div class="field"><label>Scope</label><input value="production / payments" readonly></div><div class="field wide"><label>Match</label><input name="match" value="POST /v1/payments/*" required></div><div class="field wide"><label>Description</label><textarea name="description">Allow checkout requests to reach the payment service.</textarea></div></form>`,[{label:'Cancel',action:closeModal},{label:'Create intention',primary:true,action:()=>{const form=document.getElementById('intentionForm');if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));(state.created.intention??=[]).unshift([values.source,values.destination,values.decision,values.match,'just now']);closeModal();renderIntentions();toast('Intention committed at index 12,843')}}])}
  function newKey(){showModal('Create key',`<form class="form-grid" id="keyForm"><div class="field wide"><label>Key</label><input name="key" value="apps/payments/features/fast-refunds" required></div><div class="field wide"><label>Value</label><textarea name="value" required>{\n  "enabled": false\n}</textarea></div><div class="field"><label>Write mode</label><select name="mode"><option>Create only</option><option>Set value</option></select></div><div class="field"><label>Flags</label><input name="flags" type="number" value="0"></div></form><p>The key will be created in production / payments.</p>`,[{label:'Cancel',action:closeModal},{label:'Create key',primary:true,action:()=>{const form=document.getElementById('keyForm');if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));if(!data.kv.some(k=>k.key===values.key))data.kv.push({key:values.key,folder:false,value:values.value,create:12843,modify:12843,session:'—'});state.kv=values.key;closeModal();renderKv();toast(`Key created at index 12,843`)}}])}
  const creationFlows={
    route:{title:'Create route',noun:'Route',fields:'<div class="field"><label>Route name</label><input name="name" value="checkout-canary" required></div><div class="field"><label>Match</label><input name="match" value="Header x-release: canary" required></div><div class="field"><label>Destination</label><input name="destination" value="payment-api-v2 5% · payment-api 95%" required></div><div class="field"><label>Scope</label><input name="scope" value="production / payments" readonly></div>',row:v=>[v.name,v.match,v.destination,v.scope,'Valid']},
    gateway:{title:'Create gateway',noun:'Gateway',fields:'<div class="field"><label>Gateway name</label><input name="name" value="partner-ingress" required></div><div class="field"><label>Type</label><select name="type"><option>Ingress</option><option>Mesh</option><option>Terminating</option></select></div><div class="field"><label>Address</label><input name="address" value="10.24.4.8:443" required></div><div class="field"><label>Bound services</label><input name="services" value="payment-api" required></div>',row:v=>[v.name,v.type,'Passing',v.address,v.services]},
    session:{title:'Create session',noun:'Session',fields:'<div class="field"><label>Session name</label><input name="name" value="release-82" required></div><div class="field"><label>Owner</label><input name="owner" value="release-agent" required></div><div class="field"><label>TTL</label><select name="ttl"><option>60 sec</option><option>30 sec</option><option>15 sec</option></select></div><div class="field"><label>Lock delay</label><select name="delay"><option>15 sec</option><option>0 sec</option></select></div>',row:v=>[v.name,v.owner,v.ttl,'—','Healthy']},
    watch:{title:'Create watch',noun:'Watch',fields:'<div class="field"><label>Watch name</label><input name="name" value="watch-refunds" required></div><div class="field"><label>Target type</label><select name="type"><option>Key prefix</option><option>Service</option><option>Events</option></select></div><div class="field wide"><label>Target</label><input name="target" value="apps/payments/features/" required></div>',row:v=>[v.name,v.target,'12,842','0 / 256','Live']},
    remote:{title:'Add datacenter or peer',noun:'Relationship',fields:'<div class="field"><label>Remote name</label><input name="name" value="amsterdam-1" required></div><div class="field"><label>Relationship</label><select name="relationship"><option>Federated datacenter</option><option>Peer</option></select></div><div class="field wide"><label>Advertised address</label><input name="address" value="qraft.example.test:8502" required></div>',row:v=>[v.name,v.relationship,'Connecting','—','Pending']},
    namespace:{title:'Create namespace',noun:'Namespace',fields:'<div class="field"><label>Tenant</label><input name="tenant" value="production" required></div><div class="field"><label>Namespace</label><input name="namespace" value="refunds" required></div><div class="field wide"><label>Quota profile</label><select name="quota"><option>Inherit tenant defaults</option><option>Standard</option><option>Restricted</option></select></div>',row:v=>[v.tenant,v.namespace,'Enabled','0','0','Inherited']},
    access:{title:'Create access resource',noun:'Access resource',fields:'<div class="field"><label>Name</label><input name="name" value="refunds-operator" required></div><div class="field"><label>Resource type</label><select name="type"><option>Policy</option><option>Role</option><option>Token</option><option>Auth method</option></select></div><div class="field wide"><label>Scope</label><input name="scope" value="production / payments" required></div><div class="field wide"><label>Description</label><textarea name="description">Operate refund services and keys.</textarea></div>',row:v=>[v.name,v.type,v.scope,'0 assignments','just now']}
  };
  function createResource(kind){const flow=creationFlows[kind];if(!flow)return;showModal(flow.title,`<form class="form-grid" id="createForm">${flow.fields}</form><p>This change will use the authenticated Raft command path and produce an audit event.</p>`,[{label:'Cancel',action:closeModal},{label:`Create ${flow.noun.toLowerCase()}`,primary:true,action:()=>{const form=document.getElementById('createForm');if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));(state.created[kind]??=[]).unshift(flow.row(values));closeModal();renderScreen();toast(`${flow.noun} committed at index 12,843`)}}])}
  function renderMessages(){document.getElementById('messageList').innerHTML=data.notifications.map(n=>`<article class="event"><span class="event-dot ${n.type}"></span><div style="grid-column:span 2"><strong>${n.title}</strong><p>${n.text}</p><small>${n.time}</small></div></article>`).join('')}
  document.addEventListener('click',e=>{const op=e.target.closest('[data-open]');if(op){open(op.dataset.open);return}const group=e.target.closest('[data-nav-group]');if(group){group.closest('.nav-group').classList.toggle('collapsed');return}const tab=e.target.closest('[data-tab]');if(tab&&!e.target.closest('[data-close]')){state.active=tab.dataset.tab;renderAll();return}const close=e.target.closest('[data-close]');if(close){e.stopPropagation();closeTab(close.dataset.close);return}const service=e.target.closest('[data-service]');if(service){state.service=service.dataset.service;state.detailTab='overview';renderServiceDetail();return}const detail=e.target.closest('[data-detail-tab]');if(detail){state.detailTab=detail.dataset.detailTab;renderServiceDetail();return}const kv=e.target.closest('[data-kv]');if(kv){state.kv=kv.dataset.kv;renderKv();return}const create=e.target.closest('[data-create]');if(create){createResource(create.dataset.create);return}if(e.target.closest('[data-register]'))registerService();if(e.target.closest('[data-new-intention]'))newIntention();if(e.target.closest('[data-new-key]'))newKey();if(e.target.closest('[data-save-key]'))toast('Key updated with CAS at index 12,843');if(e.target.closest('[data-snapshot]'))toast('Snapshot request queued on the leader');if(e.target.closest('[data-refresh]'))toast('State refreshed at index 12,842');if(e.target.closest('[data-pause]'))toast('Live stream paused');if(e.target.closest('[data-close-modal]'))closeModal();if(e.target.closest('[data-close-drawer]'))document.getElementById('messageDrawer').classList.remove('open')});
  document.addEventListener('input',e=>{if(e.target.matches('[data-service-search]')){state.search=e.target.value;const pos=e.target.selectionStart;renderServices();const x=document.querySelector('[data-service-search]');x.focus();x.setSelectionRange(pos,pos)}});
  document.addEventListener('change',e=>{if(e.target.matches('[data-health-filter]')){state.health=e.target.value;renderServices()}if(e.target.matches('[data-event-category]')){state.eventCategory=e.target.value;renderEvents()}if(['tenantSelect','namespaceSelect','dcSelect'].includes(e.target.id)){toast(`Scope changed to ${document.getElementById('tenantSelect').value} / ${document.getElementById('namespaceSelect').value}`)}});
  document.getElementById('homeButton').onclick=()=>open('services');document.getElementById('themeButton').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('qraft-theme',t)};
  document.getElementById('messageButton').onclick=()=>{renderMessages();document.getElementById('messageDrawer').classList.add('open')};document.getElementById('userButton').onclick=()=>showModal('Operator session','<dl><div class="detail-kv"><dt>Principal</dt><dd>operator@example.test</dd></div><div class="detail-kv"><dt>Role</dt><dd>Platform operator</dd></div><div class="detail-kv"><dt>Authentication</dt><dd>OIDC</dd></div><div class="detail-kv"><dt>Session expires</dt><dd>48 minutes</dd></div></dl>',[{label:'Close',primary:true,action:closeModal}]);
  document.getElementById('quickSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(q)))};
  const sidebar=document.getElementById('sidebar');document.getElementById('collapseNav').onclick=()=>{const c=sidebar.classList.toggle('collapsed');document.documentElement.style.setProperty('--nav-width',c?'72px':'272px');document.getElementById('collapseNav').textContent=c?'›':'‹'};
  const mobile=document.getElementById('mobileNavButton'),media=matchMedia('(max-width:760px)');function mediaState(){mobile.classList.toggle('hidden',!media.matches)}media.addEventListener('change',mediaState);mediaState();mobile.onclick=()=>sidebar.classList.toggle('mobile-open');
  const splitter=document.getElementById('splitter');let dragging=false;splitter.onpointerdown=e=>{dragging=true;splitter.classList.add('dragging');splitter.setPointerCapture(e.pointerId)};splitter.onpointermove=e=>{if(!dragging)return;const w=Math.max(210,Math.min(420,e.clientX));document.documentElement.style.setProperty('--nav-width',w+'px');splitter.setAttribute('aria-valuenow',w)};splitter.onpointerup=()=>{dragging=false;splitter.classList.remove('dragging')};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('messageDrawer').classList.remove('open');sidebar.classList.remove('mobile-open')}});
  const saved=localStorage.getItem('qraft-theme');if(saved)document.documentElement.dataset.theme=saved;open('services');
})();
</script>
