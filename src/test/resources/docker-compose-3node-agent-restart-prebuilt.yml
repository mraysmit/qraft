# 3-node Raft cluster and one client-mode agent with the restart profile, from the pre-built image
# (no Docker build step). Requires qraft-runtime:test image — built by SharedDockerClusterFixture.

services:
  controller1:
    image: qraft-runtime:test
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8080"
    volumes:
      - ../../../docker/config/three-node-acceptance/controller1.json:/etc/qraft/server.json:ro
      - controller1-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  controller2:
    image: qraft-runtime:test
    hostname: controller2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8080"
    volumes:
      - ../../../docker/config/three-node-acceptance/controller2.json:/etc/qraft/server.json:ro
      - controller2-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  controller3:
    image: qraft-runtime:test
    hostname: controller3
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8080"
    volumes:
      - ../../../docker/config/three-node-acceptance/controller3.json:/etc/qraft/server.json:ro
      - controller3-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    image: qraft-runtime:test
    hostname: agent
    command: ["client", "--config", "/etc/qraft/client.json"]
    ports:
      - "8080"
    volumes:
      - ../../../docker/config/agent-acceptance/agent-restart.json:/etc/qraft/client.json:ro
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  raft-cluster:
    driver: bridge

volumes:
  controller1-data:
  controller2-data:
  controller3-data:
