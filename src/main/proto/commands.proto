syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.mars.qraft.raft.grpc";
option java_outer_classname = "CommandsProto";

package qraft.raft;

// Values 3, 4, 6, and 8 are the job system's statuses. They are never written, and replicated history that
// holds them decodes as HEALTHY, HEALTHY, DEGRADED, and MAINTENANCE.
enum ClientStatusProto {
  CLIENT_STATUS_UNSPECIFIED = 0;
  CLIENT_STATUS_REGISTERING = 1;
  CLIENT_STATUS_HEALTHY = 2;
  CLIENT_STATUS_ACTIVE = 3 [deprecated = true];
  CLIENT_STATUS_IDLE = 4 [deprecated = true];
  CLIENT_STATUS_DEGRADED = 5;
  CLIENT_STATUS_OVERLOADED = 6 [deprecated = true];
  CLIENT_STATUS_MAINTENANCE = 7;
  CLIENT_STATUS_DRAINING = 8 [deprecated = true];
  CLIENT_STATUS_UNREACHABLE = 9;
  CLIENT_STATUS_FAILED = 10;
  CLIENT_STATUS_DEREGISTERED = 11;
}

enum ClientCommandType {
  CLIENT_CMD_UNSPECIFIED = 0;
  CLIENT_CMD_REGISTER = 1;
  CLIENT_CMD_DEREGISTER = 2;
  CLIENT_CMD_UPDATE_STATUS = 3;
  CLIENT_CMD_UPDATE_CAPABILITIES = 4;
  CLIENT_CMD_HEARTBEAT = 5;
  CLIENT_CMD_EXPIRE = 6;
}

enum SystemMetadataCommandType {
  SYSTEM_METADATA_CMD_UNSPECIFIED = 0;
  SYSTEM_METADATA_CMD_SET = 1;
  SYSTEM_METADATA_CMD_DELETE = 2;
}

message ClientSystemInfoProto {
  optional string operating_system = 1;
  optional string architecture = 2;
  optional string java_version = 3;
  int64 total_memory = 4;
  int64 available_memory = 5;
  int64 total_disk_space = 6;
  int64 available_disk_space = 7;
  int32 cpu_cores = 8;
  double cpu_usage = 9;
  double load_average = 10;
}

message ClientNetworkInfoProto {
  optional string public_ip_address = 1;
  optional string private_ip_address = 2;
  repeated string network_interfaces = 3;
  int64 bandwidth_capacity = 4;
  int64 current_bandwidth_usage = 5;
  double latency_ms = 6;
  double packet_loss_percentage = 7;
  optional string connection_type = 8;
  bool is_nat_traversal = 9;
  repeated int32 firewall_ports = 10;
}

message ClientCapabilitiesProto {
  repeated string supported_services = 1;
  reserved 2, 3, 4;
  repeated string available_regions = 5;
  reserved 6, 7;
  // Legacy: values rendered as text, which loses their JSON types. Read only when field 11 is empty.
  map<string, string> custom_capabilities = 8;
  ClientSystemInfoProto system_info = 9;
  ClientNetworkInfoProto network_info = 10;
  // Each value encoded as JSON so numbers, booleans, lists, objects, and null survive replication.
  map<string, string> custom_capabilities_json = 11;
}

message ClientInfoProto {
  string client_id = 1;
  optional string hostname = 2;
  optional string address = 3;
  int32 port = 4;
  ClientCapabilitiesProto capabilities = 5;
  ClientStatusProto status = 6;
  int64 registration_time_epoch_ms = 7;
  int64 last_heartbeat_epoch_ms = 8;
  optional string version = 9;
  optional string region = 10;
  optional string datacenter = 11;
  map<string, string> metadata = 12;
}

message ClientCommandProto {
  ClientCommandType type = 1;
  string client_id = 2;
  ClientInfoProto client_info = 3;
  ClientStatusProto new_status = 4;
  ClientCapabilitiesProto new_capabilities = 5;
  int64 timestamp_epoch_ms = 6;
  ClientStatusProto expected_status = 7;
  int64 sequence_number = 8;
  string registration_id = 9;
  int64 expected_last_contact_epoch_ms = 10;
  bool reap = 11;
}

message SystemMetadataCommandProto {
  SystemMetadataCommandType type = 1;
  string key = 2;
  string value = 3;
}

enum CatalogCommandType {
  CATALOG_CMD_UNSPECIFIED = 0;
  CATALOG_CMD_REGISTER = 1;
  CATALOG_CMD_DEREGISTER = 2;
  CATALOG_CMD_OBSERVE_HEALTH = 3;
  CATALOG_CMD_EXPIRE_HEALTH = 4;
}

message ServiceInstanceProto {
  string service_id = 1;
  string service_name = 2;
  string node_id = 3;
  string address = 4;
  int32 port = 5;
  repeated string tags = 6;
  map<string, string> metadata = 7;
  string health = 8;
  string tenant_id = 9;
  string namespace = 10;
  string datacenter = 11;
  string region = 12;
  optional bool enabled = 13;
}

message CatalogCommandProto {
  CatalogCommandType type = 1;
  string service_id = 2;
  ServiceInstanceProto instance = 3;
  string node_id = 4;
  string tenant_id = 5;
  string namespace = 6;
  HealthObservationCommandProto health_observation = 7;
  HealthExpiryCommandProto health_expiry = 8;
  // A registration that declares its checks; false, including older entries, keeps existing checks.
  bool checks_declared = 9;
  repeated string declared_check_ids = 10;
}

message HealthObservationCommandProto {
  string tenant_id = 1;
  string namespace = 2;
  string node_id = 3;
  string service_id = 4;
  string check_id = 5;
  string status = 6;
  int64 sequence_number = 7;
  int64 observed_at_epoch_ms = 8;
  int64 ttl_ms = 9;
  bool required = 10;
  string output = 11;
  int64 accepted_at_epoch_ms = 12;
  // Zero, including entries written before this field existed, means never deregister automatically.
  int64 deregister_after_ms = 13;
}

message HealthExpiryCommandProto {
  string tenant_id = 1;
  string namespace = 2;
  string node_id = 3;
  string service_id = 4;
  string check_id = 5;
  int64 expected_sequence_number = 6;
  int64 expected_deadline_epoch_ms = 7;
  bool deregister_service = 8;
}

// A server in a Raft configuration: its durable server ID, name, address, and whether it votes.
message RaftServerProto {
  string server_id = 1;
  string name = 2;
  string address = 3;
  bool voter = 4;
}

// The servers a cluster replicates to. Handled by the Raft node itself, never by the state machine.
message RaftConfigurationProto {
  repeated RaftServerProto servers = 1;
}

message RaftCommandMessage {
  oneof command {
    ClientCommandProto client_command = 1;
    SystemMetadataCommandProto system_metadata_command = 2;
    CatalogCommandProto catalog_command = 3;
    RaftConfigurationProto configuration = 4;
  }
}
