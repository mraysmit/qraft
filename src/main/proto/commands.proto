syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.mars.qraft.raft.grpc";
option java_outer_classname = "CommandsProto";

package qraft.raft;

// The three statuses Qraft sets are 1, 2, and 9. The others were never set by Qraft: 3, 4, 6, and 8 are the job
// system's, and 5, 7, 10, and 11 were removed with the node model's reduction. Replicated history that holds one
// decodes as HEALTHY, except 10 and 11, which decode as UNREACHABLE. None is ever written.
enum NodeStatusProto {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_REGISTERING = 1;
  NODE_STATUS_HEALTHY = 2;
  NODE_STATUS_ACTIVE = 3 [deprecated = true];
  NODE_STATUS_IDLE = 4 [deprecated = true];
  NODE_STATUS_DEGRADED = 5 [deprecated = true];
  NODE_STATUS_OVERLOADED = 6 [deprecated = true];
  NODE_STATUS_MAINTENANCE = 7 [deprecated = true];
  NODE_STATUS_DRAINING = 8 [deprecated = true];
  NODE_STATUS_UNREACHABLE = 9;
  NODE_STATUS_FAILED = 10 [deprecated = true];
  NODE_STATUS_DEREGISTERED = 11 [deprecated = true];
}

// Value 4 was the capabilities update. Qraft never issued it; an entry that holds it is skipped, never written.
enum NodeCommandType {
  NODE_CMD_UNSPECIFIED = 0;
  NODE_CMD_REGISTER = 1;
  NODE_CMD_DEREGISTER = 2;
  NODE_CMD_UPDATE_STATUS = 3;
  NODE_CMD_UPDATE_CAPABILITIES = 4 [deprecated = true];
  NODE_CMD_HEARTBEAT = 5;
  NODE_CMD_EXPIRE = 6;
}

enum SystemMetadataCommandType {
  SYSTEM_METADATA_CMD_UNSPECIFIED = 0;
  SYSTEM_METADATA_CMD_SET = 1;
  SYSTEM_METADATA_CMD_DELETE = 2;
}

// Fields 2, 4, 5, and 9 were the host name, the port, the capabilities, and the version. A node no longer has
// them; entries that hold them still parse, and the values are ignored.
message NodeProto {
  string name = 1;
  reserved 2;
  optional string address = 3;
  reserved 4, 5;
  NodeStatusProto status = 6;
  int64 registration_time_epoch_ms = 7;
  int64 last_heartbeat_epoch_ms = 8;
  reserved 9;
  optional string region = 10;
  optional string datacenter = 11;
  map<string, string> metadata = 12;
  // The node ID, the UUID its client keeps in its data directory. Absent from entries written before it.
  optional string id = 13;
  reserved "client_id", "hostname", "port", "capabilities", "version";
}

// Field 5 held the new capabilities of the removed capabilities update.
message NodeCommandProto {
  NodeCommandType type = 1;
  string name = 2;
  NodeProto node = 3;
  NodeStatusProto new_status = 4;
  reserved 5;
  int64 timestamp_epoch_ms = 6;
  NodeStatusProto expected_status = 7;
  int64 sequence_number = 8;
  string registration_id = 9;
  int64 expected_last_contact_epoch_ms = 10;
  bool reap = 11;
  // The ID of the node that sent a deregistration. Absent from older entries and from clients without one.
  optional string node_uuid = 12;
  reserved "client_id", "client_info", "new_capabilities";
}
message SystemMetadataCommandProto {
  SystemMetadataCommandType type = 1;
  string key = 2;
  string value = 3;
}

enum CatalogCommandType {
  CATALOG_CMD_UNSPECIFIED = 0;
  CATALOG_CMD_REGISTER = 1;
  CATALOG_CMD_DEREGISTER = 2;
  CATALOG_CMD_OBSERVE_HEALTH = 3;
  CATALOG_CMD_EXPIRE_HEALTH = 4;
}

message ServiceInstanceProto {
  string service_id = 1;
  string service_name = 2;
  string node_id = 3;
  string address = 4;
  int32 port = 5;
  repeated string tags = 6;
  map<string, string> metadata = 7;
  string health = 8;
  string tenant_id = 9;
  string namespace = 10;
  string datacenter = 11;
  string region = 12;
  optional bool enabled = 13;
}

message CatalogCommandProto {
  CatalogCommandType type = 1;
  string service_id = 2;
  ServiceInstanceProto instance = 3;
  string node_id = 4;
  string tenant_id = 5;
  string namespace = 6;
  HealthObservationCommandProto health_observation = 7;
  HealthExpiryCommandProto health_expiry = 8;
  // A registration that declares its checks; false, including older entries, keeps existing checks.
  bool checks_declared = 9;
  repeated string declared_check_ids = 10;
  // The ID of the node that sent a registration, deregistration or observation. Absent from older entries
  // and from clients without one.
  optional string node_uuid = 11;
}

message HealthObservationCommandProto {
  string tenant_id = 1;
  string namespace = 2;
  string node_id = 3;
  string service_id = 4;
  string check_id = 5;
  string status = 6;
  int64 sequence_number = 7;
  int64 observed_at_epoch_ms = 8;
  int64 ttl_ms = 9;
  bool required = 10;
  string output = 11;
  int64 accepted_at_epoch_ms = 12;
  // Zero, including entries written before this field existed, means never deregister automatically.
  int64 deregister_after_ms = 13;
}

message HealthExpiryCommandProto {
  string tenant_id = 1;
  string namespace = 2;
  string node_id = 3;
  string service_id = 4;
  string check_id = 5;
  int64 expected_sequence_number = 6;
  int64 expected_deadline_epoch_ms = 7;
  bool deregister_service = 8;
}

// A server in a Raft configuration: its durable server ID, name, address, and whether it votes.
message RaftServerProto {
  string server_id = 1;
  string name = 2;
  string address = 3;
  bool voter = 4;
}

// The servers a cluster replicates to. Handled by the Raft node itself, never by the state machine.
message RaftConfigurationProto {
  repeated RaftServerProto servers = 1;
}

// The resources and access levels of ACL rules. Zero is never written; an entry holding it, or a value this server
// does not know, is refused rather than read as another resource or level.
enum AclResourceProto {
  ACL_RESOURCE_UNSPECIFIED = 0;
  ACL_RESOURCE_NODE = 1;
  ACL_RESOURCE_SERVICE = 2;
  ACL_RESOURCE_CLIENT = 3;
  ACL_RESOURCE_OPERATOR = 4;
  ACL_RESOURCE_ACL = 5;
  ACL_RESOURCE_KEY = 6;
  ACL_RESOURCE_SESSION = 7;
}

enum AclAccessProto {
  ACL_ACCESS_UNSPECIFIED = 0;
  ACL_ACCESS_READ = 1;
  ACL_ACCESS_WRITE = 2;
  ACL_ACCESS_DENY = 3;
}

// The tenants or namespaces a service rule applies in: an exact name, or a prefix that may be empty.
message AclScopeProto {
  string name = 1;
  bool prefix = 2;
}

// One rule of a policy. A single-valued resource has no name; only a service rule has a tenant and a namespace.
message AclRuleProto {
  AclResourceProto resource = 1;
  optional string name = 2;
  bool prefix = 3;
  AclAccessProto access = 4;
  AclScopeProto tenant = 5;
  AclScopeProto namespace = 6;
}

message AclNodeIdentityProto {
  string node_name = 1;
}

message AclServiceIdentityProto {
  string service_name = 1;
  string tenant = 2;
  string namespace = 3;
}

// A token as replicated state holds it: the SHA-256 hash of its secret, never the secret.
message AclTokenProto {
  string accessor_id = 1;
  string secret_hash = 2;
  string description = 3;
  repeated string policy_ids = 4;
  repeated string role_ids = 5;
  repeated AclNodeIdentityProto node_identities = 6;
  repeated AclServiceIdentityProto service_identities = 7;
  int64 create_time_epoch_ms = 8;
  optional int64 expiration_time_epoch_ms = 9;
  bool installed_from_file = 10;
}

message AclPolicyProto {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated AclRuleProto rules = 4;
}

message AclRoleProto {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string policy_ids = 4;
  repeated AclNodeIdentityProto node_identities = 5;
  repeated AclServiceIdentityProto service_identities = 6;
}

message AclBootstrapProto {
  AclTokenProto token = 1;
  int64 reset_index = 2;
}

message AclDeleteExpiredTokensProto {
  int64 as_of_epoch_ms = 1;
  repeated string accessor_ids = 2;
}

// A mutation of the replicated ACL state. An entry with no command set is refused.
message AclCommandProto {
  oneof command {
    AclTokenProto create_token = 1;
    AclTokenProto update_token = 2;
    string delete_token = 3;
    AclPolicyProto create_policy = 4;
    AclPolicyProto update_policy = 5;
    string delete_policy = 6;
    AclRoleProto create_role = 7;
    AclRoleProto update_role = 8;
    string delete_role = 9;
    AclBootstrapProto bootstrap = 10;
    AclDeleteExpiredTokensProto delete_expired_tokens = 11;
  }
}

// A key/value write (key/value list, Phase 1). A compare-and-set index, when present, is the entry's modify index
// the write requires, or 0 for an absent key.
message KvSetProto {
  string key = 1;
  bytes value = 2;
  uint64 flags = 3;
  optional uint64 cas = 4;
}

message KvDeleteProto {
  string key = 1;
  optional uint64 cas = 2;
}

// A session acquiring or releasing a key (sessions list, Phase 1); at_ms is the leader's time.
message KvLockProto {
  string key = 1;
  bytes value = 2;
  uint64 flags = 3;
  string session = 4;
  int64 at_ms = 5;
}

message KvUnlockProto {
  string key = 1;
  bytes value = 2;
  uint64 flags = 3;
  string session = 4;
}

message KvCommandProto {
  string tenant = 1;
  string namespace = 2;
  oneof command {
    KvSetProto set = 3;
    KvDeleteProto delete = 4;
    string delete_tree_prefix = 5;
    KvLockProto lock = 6;
    KvUnlockProto unlock = 7;
  }
}

// A session (sessions list, Phase 1); durations and times in milliseconds.
message SessionProto {
  string id = 1;
  string node = 2;
  string name = 3;
  string behavior = 4;
  int64 ttl_ms = 5;
  int64 lock_delay_ms = 6;
  int64 create_time_ms = 7;
}

message SessionDestroyProto {
  string id = 1;
  int64 at_ms = 2;
}

// A tenant or namespace change (tenancy list, Phase 1); a deletion carries only the names.
message TenantProto {
  string name = 1;
  string description = 2;
}

message NamespaceProto {
  string tenant = 1;
  string name = 2;
  string description = 3;
}

// An auth method, binding rule, login or logout (authentication list, Phase 1); durations in milliseconds.
message JwtConfigProto {
  repeated string public_keys_pem = 1;
  string bound_issuer = 2;
  repeated string bound_audiences = 3;
  map<string, string> claim_mappings = 4;
  map<string, string> list_claim_mappings = 5;
  int64 expiration_leeway_ms = 6;
  int64 not_before_leeway_ms = 7;
  int64 clock_skew_leeway_ms = 8;
}

message AuthMethodProto {
  string name = 1;
  string type = 2;
  string description = 3;
  int64 max_token_ttl_ms = 4;
  JwtConfigProto config = 5;
}

message BindingRuleProto {
  string id = 1;
  string description = 2;
  string auth_method = 3;
  string selector = 4;
  string bind_type = 5;
  string bind_name = 6;
}

message LoginProto {
  AclTokenProto token = 1;
  string method = 2;
}

message AuthCommandProto {
  oneof command {
    AuthMethodProto create_method = 1;
    AuthMethodProto update_method = 2;
    string delete_method = 3;
    BindingRuleProto create_binding_rule = 4;
    BindingRuleProto update_binding_rule = 5;
    string delete_binding_rule = 6;
    LoginProto login = 7;
    string logout = 8;
  }
}

// A write that applies only where its tenant and namespace exist (tenancy list, Phase 2); command holds the
// encoded RaftCommandMessage of the write itself.
message ScopedWriteProto {
  string tenant = 1;
  string namespace = 2;
  bytes command = 3;
}

message TenancyCommandProto {
  oneof command {
    TenantProto create_tenant = 1;
    TenantProto update_tenant = 2;
    TenantProto delete_tenant = 3;
    NamespaceProto create_namespace = 4;
    NamespaceProto update_namespace = 5;
    NamespaceProto delete_namespace = 6;
  }
}

message SessionCommandProto {
  oneof command {
    SessionProto create = 1;
    SessionDestroyProto destroy = 2;
  }
}

message RaftCommandMessage {
  oneof command {
    NodeCommandProto node_command = 1;
    SystemMetadataCommandProto system_metadata_command = 2;
    CatalogCommandProto catalog_command = 3;
    RaftConfigurationProto configuration = 4;
    AclCommandProto acl_command = 5;
    KvCommandProto kv_command = 6;
    SessionCommandProto session_command = 7;
    TenancyCommandProto tenancy_command = 8;
    ScopedWriteProto scoped_write = 9;
    AuthCommandProto auth_command = 10;
  }
}
