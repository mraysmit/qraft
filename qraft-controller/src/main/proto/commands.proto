syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.mars.qraft.controller.raft.grpc";
option java_outer_classname = "CommandsProto";

package qraft.raft;

enum AgentStatusProto {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_REGISTERING = 1;
  AGENT_STATUS_HEALTHY = 2;
  AGENT_STATUS_ACTIVE = 3;
  AGENT_STATUS_IDLE = 4;
  AGENT_STATUS_DEGRADED = 5;
  AGENT_STATUS_OVERLOADED = 6;
  AGENT_STATUS_MAINTENANCE = 7;
  AGENT_STATUS_DRAINING = 8;
  AGENT_STATUS_UNREACHABLE = 9;
  AGENT_STATUS_FAILED = 10;
  AGENT_STATUS_DEREGISTERED = 11;
}

enum AgentCommandType {
  AGENT_CMD_UNSPECIFIED = 0;
  AGENT_CMD_REGISTER = 1;
  AGENT_CMD_DEREGISTER = 2;
  AGENT_CMD_UPDATE_STATUS = 3;
  AGENT_CMD_UPDATE_CAPABILITIES = 4;
  AGENT_CMD_HEARTBEAT = 5;
}

enum SystemMetadataCommandType {
  SYSTEM_METADATA_CMD_UNSPECIFIED = 0;
  SYSTEM_METADATA_CMD_SET = 1;
  SYSTEM_METADATA_CMD_DELETE = 2;
}

message AgentSystemInfoProto {
  string operating_system = 1;
  string architecture = 2;
  string java_version = 3;
  int64 total_memory = 4;
  int64 available_memory = 5;
  int64 total_disk_space = 6;
  int64 available_disk_space = 7;
  int32 cpu_cores = 8;
  double cpu_usage = 9;
  double load_average = 10;
}

message AgentNetworkInfoProto {
  string public_ip_address = 1;
  string private_ip_address = 2;
  repeated string network_interfaces = 3;
  int64 bandwidth_capacity = 4;
  int64 current_bandwidth_usage = 5;
  double latency_ms = 6;
  double packet_loss_percentage = 7;
  string connection_type = 8;
  bool is_nat_traversal = 9;
  repeated int32 firewall_ports = 10;
}

message AgentCapabilitiesProto {
  repeated string supported_services = 1;
  reserved 2, 3, 4;
  repeated string available_regions = 5;
  reserved 6, 7;
  map<string, string> custom_capabilities = 8;
  AgentSystemInfoProto system_info = 9;
  AgentNetworkInfoProto network_info = 10;
}

message AgentInfoProto {
  string agent_id = 1;
  string hostname = 2;
  string address = 3;
  int32 port = 4;
  AgentCapabilitiesProto capabilities = 5;
  AgentStatusProto status = 6;
  int64 registration_time_epoch_ms = 7;
  int64 last_heartbeat_epoch_ms = 8;
  string version = 9;
  string region = 10;
  string datacenter = 11;
  map<string, string> metadata = 12;
}

message AgentCommandProto {
  AgentCommandType type = 1;
  string agent_id = 2;
  AgentInfoProto agent_info = 3;
  AgentStatusProto new_status = 4;
  AgentCapabilitiesProto new_capabilities = 5;
  int64 timestamp_epoch_ms = 6;
  AgentStatusProto expected_status = 7;
  int64 sequence_number = 8;
  string registration_id = 9;
}

message SystemMetadataCommandProto {
  SystemMetadataCommandType type = 1;
  string key = 2;
  string value = 3;
}

enum CatalogCommandType {
  CATALOG_CMD_UNSPECIFIED = 0;
  CATALOG_CMD_REGISTER = 1;
  CATALOG_CMD_DEREGISTER = 2;
  CATALOG_CMD_OBSERVE_HEALTH = 3;
  CATALOG_CMD_EXPIRE_HEALTH = 4;
}

message ServiceInstanceProto {
  string service_id = 1;
  string service_name = 2;
  string node_id = 3;
  string address = 4;
  int32 port = 5;
  repeated string tags = 6;
  map<string, string> metadata = 7;
  string health = 8;
  string tenant_id = 9;
  string namespace = 10;
  string datacenter = 11;
  string region = 12;
  optional bool enabled = 13;
}

message CatalogCommandProto {
  CatalogCommandType type = 1;
  string service_id = 2;
  ServiceInstanceProto instance = 3;
  string node_id = 4;
  string tenant_id = 5;
  string namespace = 6;
  HealthObservationCommandProto health_observation = 7;
  HealthExpiryCommandProto health_expiry = 8;
}

message HealthObservationCommandProto {
  string tenant_id = 1;
  string namespace = 2;
  string node_id = 3;
  string service_id = 4;
  string check_id = 5;
  string status = 6;
  int64 sequence_number = 7;
  int64 observed_at_epoch_ms = 8;
  int64 ttl_ms = 9;
  bool required = 10;
  string output = 11;
  int64 accepted_at_epoch_ms = 12;
}

message HealthExpiryCommandProto {
  string tenant_id = 1;
  string namespace = 2;
  string node_id = 3;
  string service_id = 4;
  string check_id = 5;
  int64 expected_sequence_number = 6;
  int64 expected_deadline_epoch_ms = 7;
  bool deregister_service = 8;
}

message RaftCommandMessage {
  oneof command {
    AgentCommandProto agent_command = 1;
    SystemMetadataCommandProto system_metadata_command = 2;
    CatalogCommandProto catalog_command = 3;
  }
}
