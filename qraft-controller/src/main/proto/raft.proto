syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.mars.qraft.controller.raft.grpc";
option java_outer_classname = "RaftProto";

package qraft.raft;

service RaftService {
  rpc RequestVote (VoteRequest) returns (VoteResponse) {}
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse) {}
  rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse) {}
  rpc Describe (DescribeRequest) returns (DescribeResponse) {}
  rpc Join (JoinRequest) returns (MembershipResponse) {}
  rpc RemoveServer (RemoveServerRequest) returns (MembershipResponse) {}
}

// A server with no Raft state asking an existing cluster to add it. Any server forwards it to the leader.
message JoinRequest {
  string server_id = 1;                // The joining server's durable server ID
  string name = 2;                     // Its configured name
  string address = 3;                  // Its Raft address
  bool forwarded = 4;                  // Set by the server that forwarded it; it is never forwarded again
}

// An operator removing a server, named by server ID or by name. Any server forwards it to the leader.
message RemoveServerRequest {
  string server_id = 1;
  string name = 2;
  string token = 3;                    // The operator token; the forwarding server and the leader both check it
  bool forwarded = 4;
}

message MembershipResponse {
  enum Status {
    UNSPECIFIED = 0;
    JOINED = 1;                        // Added as a non-voter
    ALREADY_MEMBER = 2;                // Already configured under this server ID
    REPLACING = 3;                     // An old entry with its name or address was removed; ask again
    REMOVED = 4;
    NOT_FOUND = 5;                     // No configured server has that ID or name
    REFUSED = 6;                       // The change breaks a rule, such as the quorum rule; see message
    NO_LEADER = 7;                     // No leader could be reached; try again
    UNAUTHORIZED = 8;                  // The operator token is missing, wrong, or not configured
  }
  Status status = 1;
  string message = 2;
}

// Asks a server for the facts another server needs before bootstrapping a new cluster.
message DescribeRequest {
}

message DescribeResponse {
  string server_id = 1;                // The server's durable server ID
  string name = 2;                     // Its configured name
  string address = 3;                  // Its Raft address, as it lists itself
  repeated string listed_servers = 4;  // Every server it lists, as "name=address", sorted
  bool has_state = 5;                  // Whether it holds Raft state, and so belongs to a cluster
}

message VoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
  string candidate_server_id = 5;   // The candidate's durable server ID
}

message VoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
  string voter_server_id = 3;       // The responding server's durable server ID
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
  string leader_server_id = 7;      // The leader's durable server ID
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3; // Optimization for fast backtracking
  string follower_server_id = 4;    // The responding server's durable server ID
}

message LogEntry {
  int64 term = 1;
  int64 index = 2;
  bytes data = 3; // Command payload serialized
}

// InstallSnapshot RPC (Raft §7): sent by leaders to bring lagging followers
// up to date when the required log entries have been compacted.
// Supports chunked transfer for large snapshots.
message InstallSnapshotRequest {
  int64 term = 1;                    // Leader's term
  string leader_id = 2;             // So follower can redirect clients
  int64 last_included_index = 3;    // Last log index included in snapshot
  int64 last_included_term = 4;     // Term of last_included_index
  int32 chunk_index = 5;            // Chunk sequence number (0-based)
  int32 total_chunks = 6;           // Total number of chunks
  bytes data = 7;                   // Raw snapshot chunk bytes
  bool done = 8;                    // true if this is the last chunk
  string leader_server_id = 9;      // The leader's durable server ID
}

message InstallSnapshotResponse {
  enum RejectionReason {
    UNSPECIFIED = 0;
    ASSEMBLER_STATE_LOST = 1;
    PERSISTENCE_REJECTED = 2;
  }

  int64 term = 1;                    // Follower's currentTerm (for leader to update itself)
  bool success = 2;                  // true if chunk was accepted
  int32 next_chunk_index = 3;       // Next chunk the follower expects (for retries)
  RejectionReason rejection_reason = 4; // Why a failed response requested this cursor
  string follower_server_id = 5;    // The responding server's durable server ID
}
