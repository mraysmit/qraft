version: '3.8'

# Qraft Controller Cluster for Testcontainers Integration Testing
# NOTE: container_name removed for Testcontainers compatibility

services:
  controller1:
    build:
      context: ../../../..
      dockerfile: qraft-runtime/Dockerfile
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    volumes:
      - ../../../../docker/config/three-node/controller1.json:/etc/qraft/server.json:ro
    ports:
      - "8080"
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  controller2:
    build:
      context: ../../../..
      dockerfile: qraft-runtime/Dockerfile
    hostname: controller2
    command: ["server", "--config", "/etc/qraft/server.json"]
    volumes:
      - ../../../../docker/config/three-node/controller2.json:/etc/qraft/server.json:ro
    ports:
      - "8080"
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  controller3:
    build:
      context: ../../../..
      dockerfile: qraft-runtime/Dockerfile
    hostname: controller3
    command: ["server", "--config", "/etc/qraft/server.json"]
    volumes:
      - ../../../../docker/config/three-node/controller3.json:/etc/qraft/server.json:ro
    ports:
      - "8080"
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  raft-cluster:
    driver: bridge
