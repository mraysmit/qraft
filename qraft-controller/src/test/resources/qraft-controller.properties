# Test configuration for qraft-controller

# Default test node ID (can be overridden in individual tests)
qraft.node.id=test-node

# Use the same durable storage contract as production.
qraft.raft.storage.type=raftlog
qraft.raft.storage.path=

# Production-safe durability is part of the configuration contract.
qraft.raft.storage.fsync=true
