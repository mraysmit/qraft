version: '3.8'

# 5-node Raft cluster using pre-built image (no Docker build step).
# Requires qraft-runtime:test image — built by SharedDockerCluster.

services:
  controller1:
    image: qraft-runtime:test
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
      - "8080"
    volumes:
      - ../../../../docker/config/five-node-acceptance/controller1.json:/etc/qraft/server.json:ro
      - controller1-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  controller2:
    image: qraft-runtime:test
    hostname: controller2
    command: ["server", "--config", "/etc/qraft/server.json"]
    ports:
