version: '3.8'

# 5-node Raft cluster using pre-built image (no Docker build step).
# Requires qraft-runtime:test image — built by SharedDockerCluster.

services:
  controller1:
    image: qraft-runtime:test
    hostname: controller1
    environment:
      - QRAFT_MODE=server
      - QRAFT_NODE_ID=controller1
      - QRAFT_RAFT_HOST=0.0.0.0
      - QRAFT_RAFT_PORT=9080
      - QRAFT_HTTP_PORT=8080
      - QRAFT_CLUSTER_NODES=controller1=controller1:9080,controller2=controller2:9080,controller3=controller3:9080,controller4=controller4:9080,controller5=controller5:9080
      - QRAFT_RAFT_ELECTION_TIMEOUT_MS=1500
      - QRAFT_RAFT_HEARTBEAT_INTERVAL_MS=300
      - QRAFT_RAFT_STORAGE_PATH=/app/data
      - QRAFT_RAFT_SNAPSHOT_THRESHOLD=5
      - QRAFT_RAFT_SNAPSHOT_CHECK_INTERVAL_MS=1000
      - JAVA_OPTS=-Xmx256m -Xms128m
    ports:
      - "8080"
    volumes:
      - controller1-data:/app/data
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

