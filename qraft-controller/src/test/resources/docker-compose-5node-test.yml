version: '3.8'

# Qraft 5-Node Controller Cluster for Testcontainers Integration Testing
# NOTE: container_name removed for Testcontainers compatibility
# IMPORTANT: Set DOCKER_BUILDKIT=1 environment variable for cache mount support

services:
  controller1:
    build:
      context: ../../../..
      dockerfile: qraft-runtime/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    hostname: controller1
    command: ["server", "--config", "/etc/qraft/server.json"]
    volumes:
      - ../../../../docker/config/five-node/controller1.json:/etc/qraft/server.json:ro
    ports:
      - "8080"
    networks:
      - raft-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

